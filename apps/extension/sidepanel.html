<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Convoz</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
      html, body { height: 100%; }
      body { margin: 0; display: flex; flex-direction: column; }
      h1 { font-size: 16px; margin: 0; }
      #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 8px 12px; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
      #controls { display: contents; }
      #bar .status { flex-basis: 100%; margin: 0; }
      #bar .status:empty { display: none; }
      main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      iframe { flex: 1; width: 100%; border: 0; }
      .pad { padding: 16px; }
      form { display: flex; flex-direction: column; gap: 8px; }
      label { font-weight: 600; }
      input[type="url"] { font: inherit; padding: 6px; }
      button { font: inherit; padding: 6px 12px; }
      button.quiet { margin-top: 12px; background: none; border: none; padding: 0; text-decoration: underline; cursor: pointer; }
      .status { margin: 4px 0; }
    </style>
  </head>
  <body>
    <header id="bar"><h1>Convoz</h1><span id="controls"></span></header>
    <main id="app"></main>
    <script src="sidepanel.js"></script>
  </body>
</html>

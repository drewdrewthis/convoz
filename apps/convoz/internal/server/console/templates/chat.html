{{define "body"}}
<section id="convo" class="convo">
<div class="logwrap">
<div id="log" class="log" role="log" aria-label="Messages" aria-relevant="additions"><div id="earlier" class="earlier" hidden><button id="earlier-button" class="btn small quiet" type="button">Earlier messages</button></div><div id="items" class="items"></div><div id="hint" class="hintbox" hidden><p>Type @ to bring in an agent.</p></div><div id="working" class="working" role="status" hidden></div></div>
<button id="pill" class="pill" type="button" hidden>New message ↓</button>
</div>
<div class="compose">
<div id="picker" class="pop" hidden>
<ul id="agents" class="agents" role="list" aria-label="Agents"></ul>
<p id="picker-note" class="empty" hidden></p>
</div>
<form id="composer" class="composer glass" aria-label="Composer" autocomplete="off">
<span class="slot" aria-hidden="true"></span>
<textarea id="text" rows="1" enterkeyhint="send" autocapitalize="sentences" aria-label="Message" placeholder="Message the conversation. Type @ to add an agent."></textarea>
<button id="send" class="sendbtn" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11.5l6-6 6 6"/></svg></button>
</form>
</div>
</section>
<p id="chat-error" class="chat-error" role="alert" hidden></p>
{{end}}

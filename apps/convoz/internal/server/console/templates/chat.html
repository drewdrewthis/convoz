{{define "body"}}
<section id="picker" class="picker" hidden>
<h2>Chat with</h2>
<ul id="agents" class="agents" role="list" aria-label="Agents"></ul>
<p id="picker-note" class="empty" hidden></p>
</section>
<section id="convo" class="convo" hidden>
<div class="logwrap">
<div id="log" class="log" role="log" aria-label="Messages" aria-relevant="additions"><div id="earlier" class="earlier" hidden><button id="earlier-button" class="btn small quiet" type="button">Earlier messages</button></div><div id="items" class="items"></div><div id="working" class="working" role="status" hidden></div></div>
<button id="pill" class="pill" type="button" hidden>New message ↓</button>
</div>
<form id="composer" class="composer" aria-label="Composer" autocomplete="off">
<textarea id="text" rows="1" enterkeyhint="send" autocapitalize="sentences" aria-label="Message"></textarea>
<button id="send" class="sendbtn" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11.5l6-6 6 6"/></svg></button>
</form>
</section>
<p id="chat-error" class="chat-error" role="alert" hidden></p>
{{end}}

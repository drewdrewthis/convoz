{{define "body"}}
<p class="lead">Type one of the recovery codes you saved. It works once.</p>
<form id="recover-form" class="stack" novalidate>
<div class="field"><label for="code">Recovery code</label>
<input id="code" name="code" class="code-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required></div>
<div class="actions"><button class="btn primary" type="submit">Use code</button></div>
</form>
{{end}}

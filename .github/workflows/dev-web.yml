name: dev-web

# The owner's dev build of the web app (the /dev/ pages, served by `convoz serve --dev-web-dir`). scripts/dev-web-push.sh force-pushes
# a checkout to the dev-web branch; this job builds it with base /dev/ and uploads one artifact. The relay that puts it on the server
# pins this workflow path, the branch dev-web, the run's head_sha and run id, and the sha256 this job prints as its one
# `::notice title=sha256::` line; it unpacks the tarball
# into a new release folder and swaps the server's current symlink. No server restart, no secret here.
on:
  push:
    branches: [dev-web]

permissions:
  contents: read

concurrency:
  group: dev-web
  cancel-in-progress: true

jobs:
  dev-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The gate is the copy on the base branch, never this push's own copy: a push cannot loosen the check it is held to.
      # The one exception is a head with the same sha as the base branch (already merged through the full gate).
      - name: Fast-lane gate (base copy)
        run: |
          set -euo pipefail
          # A head that IS the base branch's head (same sha) was merged after the full gate: nothing to judge, build it.
          # Any other head, an empty diff included, goes through the gate below.
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/web-react)" ]; then
            echo "dev-web head is origin/feat/web-react (same sha): merged after the full gate, gate skipped"
            exit 0
          fi
          git show origin/feat/web-react:scripts/fast_lane.py > "$RUNNER_TEMP/fast_lane.py"
          status=0
          verdict="$(python3 -I "$RUNNER_TEMP/fast_lane.py" origin/feat/web-react)" || status=$?
          printf '%s\n' "$verdict"
          test "$status" -eq 0
          printf '%s\n' "$verdict" | grep -qx 'ELIGIBLE'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the dev web app (base /dev/)
        run: CONVOZ_DEV_WEB_OUT="$RUNNER_TEMP/devweb" pnpm --filter @convoz/web build:dev
      # The relay's limits: regular files and folders only, each name of [A-Za-z0-9._@+=,~-], index.html at the top, at most 5000
      # files, 150 MB unpacked and 50 MB packed. It refuses anything else, so the job fails first.
      - name: Check the build
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/devweb"
          rm -f "$out/placeholder.txt"
          test -f "$out/index.html"
          odd="$(find "$out" -mindepth 1 ! -type f ! -type d)"
          if [ -n "$odd" ]; then printf 'not a file or folder:\n%s\n' "$odd"; exit 1; fi
          bad="$(cd "$out" && find . -mindepth 1 -printf '%f\n' | grep -v -E '^[A-Za-z0-9._@+=,~-]+$' || true)"
          if [ -n "$bad" ]; then printf 'a name outside [A-Za-z0-9._@+=,~-]:\n%s\n' "$bad"; exit 1; fi
          files="$(find "$out" -type f | wc -l)"
          bytes="$(find "$out" -type f -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')"
          echo "files=$files bytes=$bytes"
          test "$files" -le 5000
          test "$bytes" -le 157286400
      - name: Pack
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/devweb"
          mkdir -p "$RUNNER_TEMP/pack"
          name="dev-web-$GITHUB_SHA.tar.gz"
          (cd "$out" && find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort > "$RUNNER_TEMP/files.txt")
          tar --create --gzip --no-recursion --owner=0 --group=0 --numeric-owner --mtime=@0 --file "$RUNNER_TEMP/pack/$name" --directory "$out" --files-from "$RUNNER_TEMP/files.txt"
          size="$(stat -c %s "$RUNNER_TEMP/pack/$name")"
          echo "packed=$size"
          test "$size" -le 52428800
          sum="$(sha256sum "$RUNNER_TEMP/pack/$name" | cut -d ' ' -f 1)"
          echo "::notice title=sha256::$sum"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-web-${{ github.sha }}
          path: ${{ runner.temp }}/pack/dev-web-${{ github.sha }}.tar.gz
          retention-days: 3
          if-no-files-found: error

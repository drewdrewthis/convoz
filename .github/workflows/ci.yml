name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/convoz/go.mod
          cache-dependency-path: apps/convoz/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check specs
        run: python3 -I specs/scripts/check_specs.py specs
      - name: Check pins
        run: python3 -I scripts/check_pins.py
      - name: Go vet
        working-directory: apps/convoz
        run: go vet ./...
      - name: sqlc drift
        working-directory: apps/convoz
        run: make sqlc-check
      - name: go-imports
        working-directory: apps/convoz
        run: make lint-go-imports
      - name: table-ownership
        working-directory: apps/convoz
        run: make lint-table-ownership
      - name: Go test
        working-directory: apps/convoz
        run: |
          go test -timeout 300s ./...
          go test -timeout 300s -tags testhooks ./...
      - name: Go mod verify
        working-directory: apps/convoz
        run: go mod verify
      - name: Tokens build
        run: pnpm --filter @convoz/tokens build
      - name: Release build
        working-directory: apps/convoz
        run: make release
      - name: Release guard
        run: python3 -I scripts/release_guard.py apps/convoz/bin/convoz
      - name: Testhooks build
        working-directory: apps/convoz
        run: make testhooks
      # The browser scenarios run in chromium. The Playwright version is pinned exactly in e2e/package.json
      # (checked by scripts/check_pins.py), and that version names the browser build it installs.
      - name: Playwright chromium
        run: pnpm --filter @convoz/e2e exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e
      - name: Proof page
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Merge-ref checkout: HEAD^1 is the base the PR merges into, HEAD^2 the PR head. The Spec diff
          # and red-green-cell steps repeat this guard.
          [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ] || { echo "not a merge-ref checkout" >&2; exit 1; }
          base="$(git rev-parse HEAD^1)"
          pnpm proof "$base"
      - name: Proof leak-scan self-test
        run: python3 -I scripts/proof_report.py --self-test
      - name: Red-green self-test
        run: python3 -I scripts/red_green.py --self-test
      - name: Parity self-test
        run: python3 -I specs/scripts/parity.py --self-test
      - name: Parity
        run: pnpm parity
      - name: Spec diff
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Merge-ref base, as in "Proof page".
          [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ] || { echo "not a merge-ref checkout" >&2; exit 1; }
          base="$(git rev-parse HEAD^1)"
          python3 -I specs/scripts/spec_diff.py "$base" HEAD

  # AC-1: the slice's scenarios fail on the test-only commit and pass at head.
  # A matrix of phase x shard; the `red-green` job below gates them.
  red-green-cell:
    name: red-green-cell (${{ matrix.phase }} ${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        phase: [red, green, overlay]
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/convoz/go.mod
          cache-dependency-path: apps/convoz/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright chromium
        run: pnpm --filter @convoz/e2e exec playwright install --with-deps chromium
      - name: Red first, green at head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PHASE: ${{ matrix.phase }}
          SHARD: ${{ matrix.shard }}
        run: |
          # Merge-ref base, as in "Proof page" of the verify job.
          [ "$(git rev-parse HEAD^2)" = "$HEAD_SHA" ] || { echo "not a merge-ref checkout" >&2; exit 1; }
          base="$(git rev-parse HEAD^1)"
          scratch="$(mktemp -d)"
          python3 -I scripts/red_green.py --phase "$PHASE" --shard "$SHARD" --scratch "$scratch" "$base" HEAD

  # The one check to require in branch protection (not required yet: master has no protection). A failed,
  # cancelled or skipped cell all fail it.
  red-green:
    if: always() && github.event_name == 'pull_request'
    needs: red-green-cell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every cell is green
        env:
          RESULT: ${{ needs.red-green-cell.result }}
        run: test "$RESULT" = success

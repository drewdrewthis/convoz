name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/convoz/go.mod
          cache-dependency-path: apps/convoz/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check specs
        run: python3 -I specs/scripts/check_specs.py specs
      - name: Check pins
        run: python3 -I scripts/check_pins.py
      - name: Go vet
        working-directory: apps/convoz
        run: go vet ./...
      - name: sqlc drift
        working-directory: apps/convoz
        run: go tool sqlc diff
      - name: Go mod verify
        working-directory: apps/convoz
        run: go mod verify
      - name: Tokens build
        run: pnpm --filter @convoz/tokens build
      - name: Release build
        working-directory: apps/convoz
        run: make release
      - name: Release guard
        run: python3 -I scripts/release_guard.py apps/convoz/bin/convoz
      - name: Testhooks build
        working-directory: apps/convoz
        run: make testhooks
      # S0 has no browser scenarios, so no browsers are installed.
      - name: E2E
        run: pnpm e2e
      - name: Parity
        run: pnpm parity
      - name: Spec diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I specs/scripts/spec_diff.py "origin/$BASE_REF" HEAD

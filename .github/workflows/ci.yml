name: ci

on:
  # A draft PR runs no CI; it runs when the PR is marked ready, then on each push (owner msg 709: "CI should not run on drafts,
  # right? so you can also leverage the draft feature"). Set at the skeleton (5b3efa8) with no ruling before this.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  # Static checks, unit tests and the Go build. The browser scenarios run in `e2e`, in parallel; `verify` joins both.
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/convoz/go.mod
          cache-dependency-path: |
            apps/convoz/go.sum
            apps/convoz/tools/sqlc/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      # The web app first: Go embeds its build (console/web), so vet, test and the binaries see the real UI.
      - name: Web build
        run: pnpm --filter @convoz/web build
      - name: Web typecheck
        run: pnpm --filter @convoz/web typecheck
      - name: Web unit tests
        run: pnpm --filter @convoz/web test
      # The Chrome extension: its typecheck and unit tests (least access, message body). The e2e job loads its build.
      - name: Extension typecheck and unit tests
        run: pnpm --filter @convoz/extension typecheck && pnpm --filter @convoz/extension test
      # AC-16 web side: a feature used past its index.ts, or app code in packages/ui, fails here and names the file.
      - name: boundaries
        run: pnpm lint
      # Generated client code must match the contract (packages/contracts); a hand edit of schema.ts fails here.
      - name: contract-drift
        run: pnpm --filter @convoz/api-client gen:check
      - name: size-limit
        run: pnpm --filter @convoz/web size
      - name: Check specs
        run: python3 -I specs/scripts/check_specs.py specs
      - name: Check pins
        run: python3 -I scripts/check_pins.py
      - name: Go vet
        working-directory: apps/convoz
        run: go vet ./...
      - name: sqlc drift
        working-directory: apps/convoz
        run: make sqlc-check
      - name: go-imports
        working-directory: apps/convoz
        run: make lint-go-imports
      - name: table-ownership
        working-directory: apps/convoz
        run: make lint-table-ownership
      - name: Go test
        working-directory: apps/convoz
        run: |
          go test -timeout 300s ./...
          go test -timeout 300s -tags testhooks ./...
      - name: Go mod verify
        working-directory: apps/convoz
        run: go mod verify
      - name: Go mod verify (sqlc tool)
        working-directory: apps/convoz/tools/sqlc
        env:
          GOWORK: "off"
        run: go mod verify
      - name: Release build
        working-directory: apps/convoz
        run: make release
      - name: Release guard
        run: python3 -I scripts/release_guard.py apps/convoz/bin/convoz
      # Off by owner order (Convoz msg 4211) until the 30 red e2e tests are fixed; turn back on then.
      - name: Proof page
        if: false
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm proof "origin/$BASE_REF"
      - name: Proof leak-scan self-test
        run: python3 -I scripts/proof_report.py --self-test
      - name: Red-green self-test
        run: python3 -I scripts/red_green.py --self-test
      - name: Parity self-test
        run: python3 -I specs/scripts/parity.py --self-test
      # Off by owner order (Convoz msg 4211) until the 30 red e2e tests are fixed; turn back on then.
      - name: Parity
        if: false
        run: pnpm parity
      - name: Spec diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I specs/scripts/spec_diff.py "origin/$BASE_REF" HEAD


  # The browser scenarios, split in 4 Playwright shards (every project: headless, chromium, mobile, perf). Each shard builds only the
  # testhooks binary it runs (web 2 s + CLIs + go build, ~10 s), which costs less than an artifact upload and download.
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/convoz/go.mod
          cache-dependency-path: |
            apps/convoz/go.sum
            apps/convoz/tools/sqlc/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Testhooks build
        working-directory: apps/convoz
        run: make testhooks
      # The browser scenarios run in chromium. The Playwright version is pinned exactly in e2e/package.json
      # (checked by scripts/check_pins.py), and that version names the browser build it installs.
      - name: Playwright chromium
        run: pnpm --filter @convoz/e2e exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm e2e --shard=${{ matrix.shard }}/4
      - name: E2E artifacts (failure only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            /tmp/convoz-e2e-results
            e2e/report
          if-no-files-found: ignore
          retention-days: 14

  # The one check name that auto-deploy and the advisor key on. It passes only when every job it needs passed (a skipped one is a fail),
  # and it skips with them on a draft PR.
  verify:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.e2e.result }}
        run: |
          echo "checks e2e: $RESULTS"
          [ "$RESULTS" = "success success" ]

# Schemas of the identity module. Only the work package that owns identity edits this file; the root lists each by name.
Owner:
  type: object
  required: [id, handle, display_name]
  properties:
    id: { type: integer, format: int64 }
    handle: { type: string }
    display_name: { type: string }
Me:
  type: object
  required: [identity]
  properties:
    identity:
      type: object
      required: [id, handle, display_name, kind]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: string }
        display_name: { type: string }
        role: { type: string }
        kind: { type: string, enum: [human, agent] }
        description: { type: string, description: An agent's own line about itself. }
        capabilities: { type: array, items: { type: string }, description: What an agent says it can do. }
    device:
      type: object
      required: [id, limited]
      properties:
        id: { type: integer, format: int64 }
        limited: { type: boolean, description: A recovery device that may only add a passkey. }
    recovery:
      type: object
      description: Set when this device signed in with a recovery code.
      required: [codes_left, hold_until]
      properties:
        codes_left: { type: integer }
        hold_until: { type: ["integer", "null"], format: int64, description: Epoch ms when the 24-hour hold ends; null once it has. }
Identity:
  type: object
  required: [id, kind, handle, display_name, role, created_at, disabled]
  properties:
    id: { type: integer, format: int64 }
    kind: { type: string, enum: [human, agent] }
    handle: { type: string }
    display_name: { type: string }
    role: { type: string }
    created_at: { type: integer, format: int64 }
    disabled: { type: boolean }
    description: { type: string, description: "Agents only: the agent's own line about itself." }
    capabilities: { type: array, items: { type: string }, description: "Agents only: what the agent says it can do." }
    avatar_url: { type: string, description: "Where the identity's own SVG avatar is served; absent for the letter on a tint (I-32). Show it only in an img." }
    online: { type: boolean, description: Agents only. True while the agent has a live session. }
    created_by:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [human, machine] }
        name: { type: string }
Person:
  type: object
  required: [handle, display_name, kind]
  properties:
    id: { type: integer, format: int64 }
    handle: { type: string }
    display_name: { type: string }
    kind: { type: string, enum: [human, agent, system], description: A line the conversation says about itself has the kind system and no handle. }
ProfileRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    display_name: { type: string, minLength: 1, maxLength: 80 }
    description: { type: string, maxLength: 80 }
    capabilities: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 } }
    avatar_svg: { type: ["string", "null"], description: "SVG text, rebuilt from an allow-list (no DOCTYPE or ENTITY, at most 4096 characters once cleaned). null goes back to the letter on a tint. Any caller." }
Profile:
  type: object
  properties:
    handle: { type: string }
    display_name: { type: string }
    description: { type: string }
    capabilities: { type: array, items: { type: string } }
    avatar_url: { type: string, description: "Present when the caller set an avatar." }

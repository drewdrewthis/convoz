# Schemas of the identity module. Only the work package that owns identity edits this file; the root lists each by name.
Owner:
  type: object
  required: [id, handle, display_name]
  properties:
    id: { type: integer, format: int64 }
    handle: { type: string }
    display_name: { type: string }
Me:
  type: object
  required: [identity]
  properties:
    identity:
      type: object
      required: [id, handle, display_name, kind]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: string }
        display_name: { type: string }
        role: { type: string }
        kind: { type: string, enum: [human, agent] }
        description: { type: string, description: An agent's own line about itself. }
        capabilities: { type: array, items: { type: string }, description: What an agent says it can do. }
        previous_handles: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/PreviousHandle" }, description: "A lease only: the handles the agent had before, newest first." }
    device:
      type: object
      required: [id, limited]
      properties:
        id: { type: integer, format: int64 }
        limited: { type: boolean, description: A recovery device that may only add a passkey. }
    recovery:
      type: object
      description: Set when this device signed in with a recovery code.
      required: [codes_left, hold_until]
      properties:
        codes_left: { type: integer }
        hold_until: { type: ["integer", "null"], format: int64, description: Epoch ms when the 24-hour hold ends; null once it has. }
Identity:
  type: object
  required: [id, kind, handle, display_name, role, created_at, disabled]
  properties:
    id: { type: integer, format: int64 }
    kind: { type: string, enum: [human, agent] }
    handle: { type: string }
    display_name: { type: string }
    role: { type: string }
    created_at: { type: integer, format: int64 }
    disabled: { type: boolean }
    description: { type: string, description: "Agents only: the agent's own line about itself." }
    capabilities: { type: array, items: { type: string }, description: "Agents only: what the agent says it can do." }
    avatar_url: { type: string, description: "Where the identity's own SVG avatar is served; absent for the letter on a tint (I-32). Show it only in an img." }
    online: { type: boolean, description: Agents only. True while the agent has a live session. }
    previous_handles: { type: array, items: { type: string }, description: "Agents only: the handles it had before, newest first. A mention of one still names this agent (I-51)." }
    handle_changed_at: { type: integer, format: int64, description: "Agents only: when the handle last changed." }
    created_by:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [human, machine] }
        name: { type: string }
Person:
  type: object
  required: [handle, display_name, kind]
  properties:
    id: { type: integer, format: int64 }
    handle: { type: string }
    display_name: { type: string }
    kind: { type: string, enum: [human, agent, system], description: A line the conversation says about itself has the kind system and no handle. }
ProfileRequest:
  type: object
  additionalProperties: false
  minProperties: 1
  properties:
    display_name: { type: string, minLength: 1, maxLength: 80 }
    description: { type: string, maxLength: 80 }
    capabilities: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 40 } }
    avatar_svg: { type: ["string", "null"], description: "SVG text, rebuilt from an allow-list (no DOCTYPE or ENTITY, at most 4096 characters once cleaned). null goes back to the letter on a tint. Any caller." }
Profile:
  type: object
  properties:
    handle: { type: string }
    display_name: { type: string }
    description: { type: string }
    capabilities: { type: array, items: { type: string } }
    avatar_url: { type: string, description: "Present when the caller set an avatar." }
HandleRequestBody:
  type: object
  required: [handle]
  additionalProperties: false
  properties:
    handle: { type: string, description: The new handle. }
    request: { type: string, description: "The ref of a request filed before: ask what became of it." }
HandleRequestState:
  type: object
  required: [ref, state, from, to, expires_at, interval_ms]
  properties:
    ref: { type: string, description: "hdr_ and 32 hex characters." }
    state: { type: string, enum: [pending] }
    from: { type: string }
    to: { type: string }
    expires_at: { type: integer, format: int64 }
    interval_ms: { type: integer, description: How long to wait before asking again. }
HandleRequest:
  type: object
  description: An agent that asks the owner for a new handle, as Now shows it.
  required: [ref, identity_id, from, to, display_name, created_at, expires_at]
  properties:
    ref: { type: string }
    identity_id: { type: integer, format: int64 }
    from: { type: string, description: The agent's handle now. }
    to: { type: string, description: The handle it asks for. }
    display_name: { type: string }
    created_at: { type: integer, format: int64 }
    expires_at: { type: integer, format: int64 }
HandleChanged:
  type: object
  required: [identity]
  properties:
    identity:
      type: object
      required: [id, handle, previous_handle]
      properties:
        id: { type: integer, format: int64 }
        handle: { type: string }
        previous_handle: { type: string }
PreviousHandle:
  type: object
  required: [handle, until, works]
  description: A handle the agent had before. A mention of it still reaches the agent; as --as it works until `until`.
  properties:
    handle: { type: string }
    until: { type: integer, format: int64, description: "Epoch ms: --as with this handle works until then (30 days after the change)." }
    works: { type: boolean, description: True while --as with it still works. }
MentionSpan:
  type: object
  required: [as_written, identity_id, handle]
  description: One @mention of a message, resolved by id, so a handle the identity had before still names it.
  properties:
    as_written: { type: string, description: The handle as the body has it. }
    identity_id: { type: integer, format: int64 }
    handle: { type: string, description: The identity's handle now. }
Renamed:
  type: object
  required: [from, to, until]
  description: "Set when --as named a handle the agent had before: it works until `until`, then the mint is refused naming the new one."
  properties:
    from: { type: string }
    to: { type: string }
    until: { type: integer, format: int64 }

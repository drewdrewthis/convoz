# Schemas of the conversation module. Only the work package that owns conversation edits this file; the root lists each by name.
LastMessage:
  type: object
  required: [id, author_handle, preview]
  properties:
    id: { type: integer, format: int64 }
    author_handle: { type: string }
    preview: { type: string, description: At most 140 characters, one line, plain text. }
Conversation:
  type: object
  required: [id, title, created_at, last_activity_at, participants, last, unread, starred, rank]
  properties:
    id: { type: integer, format: int64 }
    title: { type: ["string", "null"] }
    created_at: { type: integer, format: int64 }
    last_activity_at: { type: integer, format: int64 }
    participants: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Person" } }
    last:
      oneOf:
        - $ref: "../openapi.yaml#/components/schemas/LastMessage"
        - type: "null"
    unread: { type: integer }
    starred: { type: boolean, description: The caller starred it. Personal to the caller (I-22); always false for an agent. }
    rank:
      type: number
      description: |
        The sort key of the row in the caller's rail: coalesce(rail_rank, created_at). Within a section (Starred, Conversations) the higher
        rank is first; activity never changes it (I-21).
    started_by: { $ref: "../openapi.yaml#/components/schemas/Person" }
    link_url: { type: string, description: The linked pull request (https). }
    muted_until: { type: integer, format: int64, description: The caller muted it until this epoch ms (253402300799000 is forever). Absent when not muted. }
    pinned:
      type: array
      description: The messages the caller pinned in it, newest pin first. The single-conversation route only.
      items: { $ref: "../openapi.yaml#/components/schemas/Message" }
    paused: { type: boolean, description: The loop breaker stopped the agents after 20 messages in a row. }
    pending:
      type: array
      description: Agents that wait for a person to add them, and the agent that asked.
      items:
        type: object
        required: [person, at]
        properties:
          person: { $ref: "../openapi.yaml#/components/schemas/Person" }
          requested_by: { $ref: "../openapi.yaml#/components/schemas/Person" }
          at: { type: integer, format: int64 }
    seen:
      type: array
      description: The agents that have seen the newest message a person wrote in the main list, first seen first. The single-conversation route only.
      items: { $ref: "../openapi.yaml#/components/schemas/Seen" }
    last_read: { type: integer, format: int64, description: The caller's read cursor in the main list when the row was built; absent when it has none. The single-conversation route only. The page keeps the value from when it opened, to mark where unread began. }
    deleted_at: { type: integer, format: int64, description: In the trash since. }
    purges_at: { type: integer, format: int64, description: When the trash removes it for good. }
Seen:
  type: object
  description: An agent that has seen a message, because its inbox claim covers it. Stored, so it survives a reload.
  required: [handle, message_id, at]
  properties:
    handle: { type: string }
    message_id: { type: integer, format: int64, description: The message that was seen (the newest a person wrote in that place). }
    at: { type: integer, format: int64, description: Epoch ms of the first claim that covered it. }

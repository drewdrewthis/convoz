# Schemas of the auth module. Only the work package that owns auth edits this file; the root lists each by name.
StepUpAction:
  type: string
  enum: [passkey.add, passkey.remove, recovery.regenerate, machine.reveal, machine.regenerate, machine.revoke, machine.allow, identity.create, data.export, data.delete, message.purge, signout.all]
Passkey:
  type: object
  required: [id, label, registered_via, created_at, last_used_at, this_device]
  properties:
    id: { type: integer, format: int64 }
    label: { type: string }
    registered_via: { type: string, enum: [bootstrap, session, recovery] }
    created_at: { type: integer, format: int64 }
    last_used_at: { type: ["integer", "null"], format: int64 }
    this_device: { type: boolean, description: The passkey the calling device signed in with. }
HostInfo:
  type: object
  description: What the machine says about itself, labelled as reported.
  properties:
    hostname: { type: string }
    os: { type: string }
    arch: { type: string }
    cli_version: { type: string }
MachineRequest:
  type: object
  required: [id, name, user_code, host_info, source_ip, via_internet, code_required, node_name, created_at, expires_at]
  properties:
    id: { type: integer, format: int64 }
    name: { type: string }
    user_code: { type: string }
    host_info:
      oneOf:
        - $ref: "../openapi.yaml#/components/schemas/HostInfo"
        - type: "null"
    source_ip: { type: ["string", "null"] }
    via_internet: { type: boolean, description: "True when the request came in on the agents-only listener (over the internet); the card says so." }
    code_required: { type: boolean, description: "True when Approve needs the last 4 characters of user_code (an internet request on a server run with --agent-approve-code)." }
    node_name: { type: ["string", "null"] }
    created_at: { type: integer, format: int64 }
    expires_at: { type: integer, format: int64 }
    identity:
      description: What the agent that ran `convoz login --as` said about itself; null for a plain login. One Approve makes the machine and this agent.
      oneOf:
        - $ref: "../openapi.yaml#/components/schemas/AgentIntro"
        - type: "null"
AgentIntro:
  type: object
  description: |
    What an agent said about itself in a request. Every text is the agent's own words: show it as plain text, labelled as from the agent,
    never as markup. The avatar is only ever an img of the cleaned SVG at avatar_url (I-32).
  required: [ref, handle, display_name, description, avatar_url, conversation]
  properties:
    ref: { type: string, description: "The unguessable id of the request (idr_ and 32 hex characters)." }
    handle: { type: string }
    display_name: { type: string, description: The handle when the agent sent no name. }
    description: { type: string, description: One line of plain text, at most 80 characters. }
    avatar_url: { type: ["string", "null"] }
    conversation:
      description: The conversation the agent joins once approved, by title; null when none or when it is not available any more.
      oneOf:
        - type: object
          required: [id, title]
          properties:
            id: { type: integer, format: int64 }
            title: { type: string }
        - type: "null"
IdentityRequest:
  description: A logged-in machine asks for an identity it may not create itself. Waits up to 24 hours.
  allOf:
    - $ref: "../openapi.yaml#/components/schemas/AgentIntro"
    - type: object
      required: [machine, machine_id, via_internet, created_at, expires_at]
      properties:
        machine: { type: string, description: The machine's name, from the server. }
        machine_id: { type: integer, format: int64 }
        via_internet: { type: boolean, description: True when the request came in on the agents-only listener; the card says so. }
        created_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }
Allow:
  type: object
  required: [mode, identities, globs]
  properties:
    mode: { type: string, enum: [any, list] }
    identities: { type: array, items: { type: string }, description: Handles. }
    globs: { type: array, items: { type: string } }
Machine:
  type: object
  required: [id, name, key_hint, scopes, allow, live_sessions, last_used_at]
  properties:
    id: { type: integer, format: int64 }
    name: { type: string }
    key_hint: { type: string }
    scopes: { type: array, items: { type: string } }
    allow: { $ref: "../openapi.yaml#/components/schemas/Allow" }
    live_sessions: { type: integer }
    last_used_at: { type: ["integer", "null"], format: int64 }
Session:
  type: object
  required: [id, identity, machine, client_id, label, state, end_reason, last_seen_at, expires_at]
  properties:
    id: { type: integer, format: int64 }
    identity: { type: string, description: The handle the session speaks as. }
    machine: { type: string, description: The name of the machine it ran on. }
    client_id: { type: string }
    label: { type: string, description: "The label the session gave itself, such as claude-7f3a." }
    state: { type: string, enum: [live, ended] }
    end_reason: { type: ["string", "null"], description: Why it ended; null while live. }
    last_seen_at: { type: integer, format: int64 }
    expires_at: { type: integer, format: int64 }

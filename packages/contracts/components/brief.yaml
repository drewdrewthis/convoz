# Schemas of the brief module. Only the work package that owns brief edits this file; the root lists each by name.
BriefSection:
  type: object
  required: [key, title, text]
  properties:
    key: { type: string, enum: [identity, handoff, answers, asks, inbox, conversations, decisions, expired] }
    title: { type: string }
    text: { type: string, description: The section as text, including its title line. }
BriefResponse:
  type: object
  required: [text, sections, bytes, page]
  properties:
    text: { type: string, description: The whole brief; the sections joined. }
    sections:
      type: array
      items: { $ref: "../openapi.yaml#/components/schemas/BriefSection" }
    bytes: { type: integer, description: The length of `text` in bytes. }
    page: { type: integer, description: The page of the conversation section. }
HandoffRequest:
  type: object
  additionalProperties: false
  required: [client_id, body]
  properties:
    client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
    body: { type: string, minLength: 1, description: "The note; at most 4096 bytes of UTF-8." }
Handoff:
  type: object
  required: [id, body, created_at, session, machine]
  properties:
    id: { type: integer, format: int64 }
    body: { type: string }
    created_at: { type: integer, format: int64 }
    session: { type: string, description: The label of the session that wrote the note. }
    machine: { type: string, description: The machine that session ran on. }
HandoffsResponse:
  type: object
  required: [handoffs]
  properties:
    handoffs: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Handoff" } }

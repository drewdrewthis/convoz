# Schemas of the message module. Only the work package that owns message edits this file; the root lists each by name.
Message:
  type: object
  required: [id, author, body, format, created_at]
  properties:
    id: { type: integer, format: int64 }
    author: { $ref: "../openapi.yaml#/components/schemas/Person" }
    body: { type: string, description: "Empty for a deleted or purged message (a tombstone)." }
    format: { type: string, enum: [plain, markdown, markdownv2] }
    created_at: { type: integer, format: int64 }
    kind: { type: string, enum: [ask, system], description: "An agent's question (ask) or a line the conversation says about itself (system). Absent for a text message." }
    ask: { $ref: "../openapi.yaml#/components/schemas/Ask", description: "The ask a message of kind ask carries: its question, options, state and history." }
    app:
      description: "The app of the message: the app itself when it is at most 4096 bytes, else a stub (GET /api/messages/{id}/app has the full app)."
      oneOf:
        - { $ref: "../openapi.yaml#/components/schemas/App" }
        - { $ref: "../openapi.yaml#/components/schemas/AppStub" }
    via_app: { $ref: "../openapi.yaml#/components/schemas/ViaApp", description: "Set on a message the owner sent through an app of an agent (I-46)." }
    needs_you: { type: boolean, description: "On every message the server sends. True while the message is an ask that waits for the owner; false on every other message, and on an ask once it is answered, dismissed or closed. Computed when the message is read, never stored." }
    via_voice: { type: boolean, description: "Set on a message the owner's voice call posted; readers see \"via voice call\"." }
    thread_root_id: { type: integer, format: int64 }
    broadcast: { type: boolean }
    reply_count: { type: integer, format: int64 }
    unread_replies: { type: integer, format: int64, description: "For a thread root: the replies the reader has not read, only in a thread the reader is in. Absent for none. Per reader." }
    last_reply_at: { type: integer, format: int64, description: When the newest reply came, for a thread root. }
    last_reply:
      type: object
      description: "The newest reply of a thread root, for the reply chip under it. Unread is per reader: set when the reply is someone else's, in a thread the reader is in, and past the reader's read point there."
      required: [id, author, preview, created_at]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: "../openapi.yaml#/components/schemas/Person" }
        preview: { type: string, maxLength: 120, description: "The plain-text projection of the reply, up to 120 characters." }
        created_at: { type: integer, format: int64 }
        unread: { type: boolean }
    edited_at: { type: integer, format: int64 }
    deleted: { type: boolean }
    purged: { type: boolean }
    system:
      type: object
      description: A system line - its subtype and the people it names, looked up when read so a rename shows at once (I-23).
      required: [t]
      additionalProperties: true
      properties:
        t: { type: string }
    unfurl: { $ref: "../openapi.yaml#/components/schemas/UnfurlCard", description: "The card of the first link of the body, as the preview worker has got (status pending until fetched). Only on a page a person reads, never an agent." }
    mentions: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/MentionSpan" }, description: "The identities the body @mentions, by id: a handle an agent had before still names it (I-51)." }
    text: { type: string, description: "The words of a system line, or the plain-text form of a message that carries files." }
    session_label: { type: string, description: "The session an agent wrote the message from (I-40)." }
    machine: { type: string, description: "The machine that session ran on (I-40)." }
    uploads:
      type: array
      description: "The files the message carries. Then `text` is the plain-text form of the whole message (a voice note reads Voice note 0:20, then the words)."
      items: { $ref: "../openapi.yaml#/components/schemas/Upload" }
Posted:
  type: object
  required: [id, conversation_id, created_at]
  properties:
    id: { type: integer, format: int64 }
    conversation_id: { type: integer, format: int64 }
    created_at: { type: integer, format: int64 }
EditRequest:
  type: object
  required: [client_id, body]
  properties:
    client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
    body: { type: string }
    format: { type: string, enum: [plain, markdown, markdownv2] }
  additionalProperties: false
EditHistory:
  type: object
  required: [edits]
  properties:
    edits:
      type: array
      items:
        type: object
        required: [body, format, edited_at]
        properties:
          body: { type: string }
          format: { type: string }
          edited_at: { type: integer, format: int64 }
          by: { type: string }

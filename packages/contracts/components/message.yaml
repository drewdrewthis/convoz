# Schemas of the message module. Only the work package that owns message edits this file; the root lists each by name.
Message:
  type: object
  required: [id, author, body, format, created_at]
  properties:
    id: { type: integer, format: int64 }
    author: { $ref: "../openapi.yaml#/components/schemas/Person" }
    body: { type: string }
    format: { type: string, enum: [plain, markdown] }
    created_at: { type: integer, format: int64 }
    kind: { type: string, enum: [ask], description: An agent's question. A plain message leaves it out. }
    ask:
      type: object
      required: [state]
      description: Where the ask stands, for a message of kind ask.
      properties:
        state: { type: string, enum: [open, answered, dismissed, closed] }
    via:
      type: object
      required: [session, machine]
      description: Which agent session wrote the message and on which machine. Only a person is told.
      properties:
        session: { type: string }
        machine: { type: string }
Posted:
  type: object
  required: [id, conversation_id, created_at]
  properties:
    id: { type: integer, format: int64 }
    conversation_id: { type: integer, format: int64 }
    created_at: { type: integer, format: int64 }

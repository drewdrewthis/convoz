# Schemas of the message module. Only the work package that owns message edits this file; the root lists each by name.
Message:
  type: object
  required: [id, author, body, format, created_at]
  properties:
    id: { type: integer, format: int64 }
    author: { $ref: "../openapi.yaml#/components/schemas/Person" }
    body: { type: string, description: "Empty for a deleted or purged message (a tombstone)." }
    format: { type: string, enum: [plain, markdown, markdownv2] }
    created_at: { type: integer, format: int64 }
    kind: { type: string, enum: [ask, system], description: "An agent's question (ask) or a line the conversation says about itself (system). Absent for a text message." }
    ask:
      type: object
      required: [state]
      description: Where the ask stands, for a message of kind ask.
      properties:
        state: { type: string, enum: [open, answered, dismissed, closed] }
    thread_root_id: { type: integer, format: int64 }
    broadcast: { type: boolean }
    reply_count: { type: integer, format: int64 }
    last_reply_at: { type: integer, format: int64, description: When the newest reply came, for a thread root. }
    edited_at: { type: integer, format: int64 }
    deleted: { type: boolean }
    purged: { type: boolean }
    system:
      type: object
      description: A system line - its subtype and the people it names, looked up when read so a rename shows at once (I-23).
      required: [t]
      additionalProperties: true
      properties:
        t: { type: string }
    text: { type: string, description: "The words of a system line." }
    session_label: { type: string, description: "The session an agent wrote the message from (I-40)." }
    machine: { type: string, description: "The machine that session ran on (I-40)." }
Posted:
  type: object
  required: [id, conversation_id, created_at]
  properties:
    id: { type: integer, format: int64 }
    conversation_id: { type: integer, format: int64 }
    created_at: { type: integer, format: int64 }
EditRequest:
  type: object
  required: [client_id, body]
  properties:
    client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
    body: { type: string }
    format: { type: string, enum: [plain, markdown, markdownv2] }
  additionalProperties: false
EditHistory:
  type: object
  required: [edits]
  properties:
    edits:
      type: array
      items:
        type: object
        required: [body, format, edited_at]
        properties:
          body: { type: string }
          format: { type: string }
          edited_at: { type: integer, format: int64 }
          by: { type: string }

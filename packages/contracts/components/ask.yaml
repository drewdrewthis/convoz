# Schemas of the ask module. Only the work package that owns ask edits this file; the root lists each by name.
AskOption:
  type: object
  required: [label, why]
  properties:
    label: { type: string, minLength: 1, maxLength: 120 }
    why: { type: string, minLength: 1, maxLength: 280 }
    recommended: { type: boolean, description: "True on the first option, the one the agent recommends." }
OwnersCall:
  type: object
  required: [kind, reason]
  additionalProperties: false
  description: Why only the owner can decide an ask. The card shows it under the question.
  properties:
    kind: { type: string, enum: [one-way, taste, values, scope, in-your-name], description: "A one-way door, a choice of taste or values, or scope the owner must own. in-your-name is the call of a draft ask only: the server sets it, with the reason \"It goes out in your name.\"" }
    reason: { type: string, minLength: 1, maxLength: 280 }
AskDraft:
  type: object
  required: [text]
  additionalProperties: false
  description: A message the agent wants to send in the owner's name, and the message it answers when there is one.
  properties:
    text: { type: string, minLength: 1, maxLength: 4000, description: The draft. }
    original: { type: string, maxLength: 2000, description: The message the draft answers. The CLI and the MCP tool cut a longer one and end it with "…". }
    original_from: { type: string, maxLength: 200, description: "Who sent the original and where, like \"Alex · Slack DM\"." }
AskReply:
  type: object
  required: [send]
  additionalProperties: false
  description: The answer of a draft ask as its agent reads it. `text` is the final text, as the owner left it, and is present only when `send` is true.
  properties:
    send: { type: boolean }
    text: { type: string, maxLength: 4000 }
AskChoice:
  type: object
  required: [kind]
  description: What the answer was. A recommended or alternative answer names an option; a custom one carries the person's words.
  properties:
    kind: { type: string, enum: [recommended, alternative, custom] }
    index: { type: integer, minimum: 1, maximum: 4, description: "The alternative (1 to 4); its place after the recommended option." }
    text: { type: string, maxLength: 4000 }
AskHistoryRow:
  type: object
  required: [version, event, to_state, at]
  description: One row of the ask's history (C-6). Append-only; ids and enums only. A row without `by` was made by the system.
  properties:
    version: { type: integer }
    event: { type: string, enum: [create, answer, dismiss, undismiss, withdraw, close, owner_replied, updated] }
    to_state: { type: string, enum: [open, answered, dismissed, closed] }
    by: { $ref: "../openapi.yaml#/components/schemas/Person" }
    at: { type: integer, format: int64 }
Ask:
  type: object
  required: [id, conversation_id, asker, question, urgent, state, options, version, created_at]
  description: |
    An ask as a reader sees it. `id` is the id of the ask message. The first option is the recommended one. `snoozed_until`
    is the caller's own snooze (a person's overlay, never part of the ask).
  properties:
    id: { type: integer, format: int64 }
    conversation_id: { type: integer, format: int64 }
    conversation: { $ref: "../openapi.yaml#/components/schemas/AskConversation" }
    thread_root_id: { type: integer, format: int64, description: The thread the ask was asked in. }
    reply_count: { type: integer, format: int64, description: "The replies in the thread that Reply in thread opens on this ask: its own, or the one it was asked in. Absent for none." }
    unread_replies: { type: integer, format: int64, description: "Of those, the ones the reader has not read, only in a thread the reader is in. Per reader. Absent for none." }
    asker: { $ref: "../openapi.yaml#/components/schemas/Person" }
    question: { type: string, maxLength: 500, description: Empty after a purge. }
    urgent: { type: boolean }
    owners_call: { $ref: "../openapi.yaml#/components/schemas/OwnersCall", description: Absent on an ask from before the field, and after a purge. }
    state: { type: string, enum: [open, answered, dismissed, closed] }
    close_reason: { type: string, enum: [removed, withdrawn, deleted, agent_revoked, replied] }
    options: { type: array, minItems: 2, maxItems: 5, items: { $ref: "../openapi.yaml#/components/schemas/AskOption" }, description: "On a draft ask: Send (the recommended one) and Don't send." }
    kind: { type: string, enum: [permission, decision, draft], description: "permission: the agent asks the owner's OK for one action. decision: options. draft: a message to send." }
    permission: { $ref: "../openapi.yaml#/components/schemas/AskPermission", description: Present on a permission ask. }
    draft: { $ref: "../openapi.yaml#/components/schemas/AskDraft", description: Present on a draft ask. Absent after a purge. }
    reply: { $ref: "../openapi.yaml#/components/schemas/AskReply", description: Present on an answered draft ask. }
    chosen: { $ref: "../openapi.yaml#/components/schemas/AskChoice" }
    answer: { type: string, description: "The answer in words: the chosen option's label, or the custom text; \"Send: <text>\" or \"Don't send\" on a draft ask." }
    answer_via: { type: string, enum: [inline, now] }
    resolved_by: { $ref: "../openapi.yaml#/components/schemas/Person" }
    resolved_at: { type: integer, format: int64 }
    acked_at: { type: integer, format: int64, description: When the asker saw the result ("Seen by @asker"). }
    owner_reply: { $ref: "../openapi.yaml#/components/schemas/AskOwnerReply", description: The owner's latest reply in the thread of this open ask; the ask then waits on its agent's updated ask. }
    answers: { type: string, maxLength: 1000, description: The short summary of the answers to the owner's questions that the latest update carries. }
    revision: { type: integer, description: 2 after the first update, 3 after the next; absent on an ask never updated. }
    changed: { type: string, description: "What the latest update changed: question, options, owner's call or answers." }
    version: { type: integer, description: Moves by one with every state change; a snooze never moves it. }
    created_at: { type: integer, format: int64 }
    snoozed_until: { type: integer, format: int64 }
    history: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/AskHistoryRow" } }
    app:
      description: "The app shown with the question: the app itself when it is at most 4096 bytes, else a stub."
      oneOf:
        - { $ref: "../openapi.yaml#/components/schemas/App" }
        - { $ref: "../openapi.yaml#/components/schemas/AppStub" }
AskPermission:
  type: object
  required: [action, risk, considered, confidence]
  description: The parts of a permission ask. One of undo and one_way is set.
  properties:
    action: { type: string, maxLength: 100 }
    risk: { type: string, maxLength: 140 }
    undo: { type: string, maxLength: 80 }
    one_way: { type: boolean }
    considered: { type: array, minItems: 1, maxItems: 3, items: { type: string, maxLength: 120 } }
    confidence: { type: integer, minimum: 0, maximum: 100, description: "What the agent said it was; self-reported, not a check." }
AskOwnerReply:
  type: object
  required: [id, text, at]
  description: The owner's latest reply in the thread of an open ask.
  properties:
    id: { type: integer, format: int64, description: The reply message. }
    text: { type: string, description: Its first 100 characters (a voice note's transcript included). }
    at: { type: integer, format: int64 }
AskUpdateRequest:
  type: object
  additionalProperties: false
  description: What the asking agent changes in its open ask. Recommended and alternatives are given together and replace the options.
  properties:
    question: { type: string, maxLength: 500, description: "A changed question is one plain sentence that tells the owner what to decide; one left as it was is not judged again." }
    recommended: { $ref: "../openapi.yaml#/components/schemas/AskOption" }
    alternatives: { type: array, minItems: 1, maxItems: 4, items: { $ref: "../openapi.yaml#/components/schemas/AskOption" } }
    owners_call_reason: { type: string, maxLength: 280 }
    answers: { type: string, maxLength: 1000 }
    permission:
      type: object
      additionalProperties: false
      required: [action, risk, considered]
      description: A permission ask only. All its parts, which replace the old ones; one of undo and one_way. There is no confidence (it is fixed at create; 400 when given).
      properties:
        action: { type: string, minLength: 1, maxLength: 100 }
        risk: { type: string, minLength: 1, maxLength: 140 }
        undo: { type: string, minLength: 1, maxLength: 80 }
        one_way: { type: boolean }
        considered: { type: array, minItems: 1, maxItems: 3, items: { type: string, minLength: 1, maxLength: 120 } }
AskConversation:
  type: object
  required: [id, title]
  properties:
    id: { type: integer, format: int64 }
    title: { type: ["string", "null"] }
AskRequest:
  type: object
  required: [conversation_id, client_id]
  additionalProperties: false
  description: |
    A permission ask (permission alone: the server sets the options Go and Not this, no owner's call is needed, and the question defaults
    to the action; a confidence under 80 is refused with the get-confident text), a draft ask (draft alone: it has no options and no
    owner's call, the server sets both), or the legacy ask with options (question, recommended, alternatives and owners_call; without
    owners_call it is refused). Permission with draft is refused.
  properties:
    conversation_id: { type: integer, format: int64 }
    thread_root_id: { type: integer, format: int64 }
    client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
    question: { type: string, minLength: 1, maxLength: 500, description: "One plain sentence that tells the owner what to decide, like \"Approve the prod deploy of PR 240?\" (3 or more words, no markdown, no status word first)." }
    recommended: { $ref: "../openapi.yaml#/components/schemas/AskOption" }
    alternatives: { type: array, minItems: 1, maxItems: 4, items: { $ref: "../openapi.yaml#/components/schemas/AskOption" } }
    owners_call: { $ref: "../openapi.yaml#/components/schemas/OwnersCall" }
    urgent: { type: boolean }
    draft: { $ref: "../openapi.yaml#/components/schemas/AskDraft" }
    permission: { $ref: "../openapi.yaml#/components/schemas/AskPermission" }
    app: { $ref: "../openapi.yaml#/components/schemas/App", description: "An app shown with the question (a chart, a table, a diff). It helps the owner decide and never answers: no picker, form or select checklist (400 app_type_not_allowed_on_ask)." }
AskAnswerRequest:
  type: object
  required: [choice]
  additionalProperties: false
  properties:
    choice: { type: string, enum: [recommended, alternative, custom] }
    index: { type: integer, minimum: 1, maximum: 4, description: "With choice alternative: which one." }
    text: { type: string, maxLength: 4000, description: "With choice custom: the person's words. With choice recommended on a draft ask: the final text to send (the draft when left out). A draft ask is answered with recommended (send) or alternative 1 (do not send)." }
    if_version: { type: integer, description: The version the person saw; another version is a 409. }
    client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
    via: { type: string, enum: [inline, now], description: "Where the person answered (default inline)." }
AskMarkRequest:
  type: object
  additionalProperties: false
  properties:
    if_version: { type: integer }
    client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
AskSnoozeRequest:
  type: object
  additionalProperties: false
  description: A preset, or an exact time. Tonight and Tomorrow are read in the zone `tz` (an IANA name, UTC when left out).
  properties:
    preset: { type: string, enum: [1h, tonight, tomorrow] }
    until: { type: integer, format: int64 }
    tz: { type: string }
OneAsk:
  type: object
  required: [ask]
  properties:
    ask: { $ref: "../openapi.yaml#/components/schemas/Ask" }
AskConflict:
  type: object
  required: [error, ask]
  description: A 409 that carries the ask as it stands, so the screen can show what won.
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ask: { $ref: "../openapi.yaml#/components/schemas/Ask" }
NowPendingAdd:
  type: object
  required: [conversation, person, at]
  description: An agent that waits for a person to add it to a conversation.
  properties:
    conversation: { $ref: "../openapi.yaml#/components/schemas/AskConversation" }
    person: { $ref: "../openapi.yaml#/components/schemas/Person" }
    requested_by: { $ref: "../openapi.yaml#/components/schemas/Person" }
    at: { type: integer, format: int64 }
NowWaiting:
  type: object
  required: [conversation, agent, text, since]
  description: A plan item an agent waits on the owner for, in a plan updated in the last 24 h.
  properties:
    conversation: { $ref: "../openapi.yaml#/components/schemas/AskConversation" }
    agent: { $ref: "../openapi.yaml#/components/schemas/Person" }
    text: { type: string }
    since: { type: integer, format: int64 }
Now:
  type: object
  required: [now, poll_ms, badge, mentions, asks, replied, snoozed, answered_today, dismissed_today, pending_adds, waiting_plans, unanswered, machine_requests, identity_requests]
  properties:
    now: { type: integer, format: int64, description: The server's clock, epoch ms. Snooze times and "tonight" are read against it. }
    poll_ms: { type: integer, description: How often an open Now asks again, for what only time changes (a snooze waking, a request expiring). }
    badge: { type: integer, description: Open asks that are not snoozed, plus mentions. }
    mentions: { type: integer, description: "The caller's conversations, not muted and not in the trash, that have an unread message that @mentions it." }
    asks: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Ask" }, description: "Open and not snoozed; urgent first, then the newest." }
    replied: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Ask" }, description: "Open, not snoozed, and the owner replied in the thread: they wait on the agent's updated ask, the newest reply first." }
    snoozed: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Ask" }, description: "The caller's snoozed open asks, the soonest wake first." }
    answered_today: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Ask" }, description: Answered in the last 24 hours, newest first. }
    dismissed_today: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Ask" }, description: Dismissed in the last 24 hours and still dismissed, newest first. }
    pending_adds: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/NowPendingAdd" } }
    waiting_plans: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/NowWaiting" }, description: Plan items agents wait on the owner for, in plans updated in the last 24 h, newest first. }
    unanswered: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/WaitingUnanswered" }, description: "The owner's newest main-chat message per conversation that nobody answered for 10 minutes. The same list as GET /api/waiting." }
    machine_requests: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/MachineRequest" } }
    identity_requests: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/IdentityRequest" }, description: Agents on logged-in machines that ask to be made. }

components:
  securitySchemes:
    deviceCookie:
      type: apiKey
      in: cookie
      name: __Host-convoz_sid
    leaseBearer:
      type: http
      scheme: bearer
      description: "The lease of an agent session (Authorization: Bearer cvz_s_...)."

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    StepUp:
      name: X-Convoz-Step-Up
      in: header
      required: true
      description: The step_up_id of a fresh passkey check for this action.
      schema: { type: string }
    StepUpOptional:
      name: X-Convoz-Step-Up
      in: header
      required: false
      schema: { type: string }

  requestBodies:
    Empty:
      required: true
      content:
        application/json:
          schema: { type: object }
    CeremonyFinish:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ceremony_id, credential]
            properties:
              ceremony_id: { type: string }
              credential:
                description: PublicKeyCredential.toJSON() of the finished prompt.
                type: object
                additionalProperties: true

  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Empty:
      description: Done.
      content:
        application/json:
          schema: { type: object }
    Ok:
      description: Done.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
    Ceremony:
      description: A WebAuthn ceremony to start in the browser.
      content:
        application/json:
          schema:
            type: object
            required: [ceremony_id, options]
            properties:
              ceremony_id: { type: string }
              options:
                type: object
                required: [publicKey]
                properties:
                  publicKey:
                    description: The JSON form of PublicKeyCredentialCreationOptions or PublicKeyCredentialRequestOptions.
                    type: object
                    additionalProperties: true
    MachineKey:
      description: The machine key, in this answer only (Cache-Control no-store). Revoke answers an empty object.
      content:
        application/json:
          schema:
            type: object
            properties:
              machine_key: { type: string }
              key_version: { type: integer }
    OneConversation:
      description: One conversation.
      content:
        application/json:
          schema:
            type: object
            required: [conversation]
            properties:
              conversation: { $ref: "#/components/schemas/Conversation" }
    Posted:
      description: The stored message.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Posted" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            retry_after: { type: integer }
    ClientId:
      type: string
      minLength: 8
      maxLength: 64
      description: Made once per command and reused on a retry, so a retry never makes a second one.
    StepUpAction: { $ref: "components/auth.yaml#/StepUpAction" }
    Owner: { $ref: "components/identity.yaml#/Owner" }
    Me: { $ref: "components/identity.yaml#/Me" }
    Identity: { $ref: "components/identity.yaml#/Identity" }
    Passkey: { $ref: "components/auth.yaml#/Passkey" }
    HostInfo: { $ref: "components/auth.yaml#/HostInfo" }
    MachineRequest: { $ref: "components/auth.yaml#/MachineRequest" }
    Allow: { $ref: "components/auth.yaml#/Allow" }
    Machine: { $ref: "components/auth.yaml#/Machine" }
    Person: { $ref: "components/identity.yaml#/Person" }
    LastMessage: { $ref: "components/conversation.yaml#/LastMessage" }
    Conversation: { $ref: "components/conversation.yaml#/Conversation" }
    Message: { $ref: "components/message.yaml#/Message" }
    Posted: { $ref: "components/message.yaml#/Posted" }
    EditRequest: { $ref: "components/message.yaml#/EditRequest" }
    EditHistory: { $ref: "components/message.yaml#/EditHistory" }
    InboxItem: { $ref: "components/inbox.yaml#/InboxItem" }
    InboxResponse: { $ref: "components/inbox.yaml#/InboxResponse" }
    ClaimRequest: { $ref: "components/inbox.yaml#/ClaimRequest" }
    AckRequest: { $ref: "components/inbox.yaml#/AckRequest" }
    AckResponse: { $ref: "components/inbox.yaml#/AckResponse" }
    MessageCreatedFrame: { $ref: "components/event.yaml#/MessageCreatedFrame" }
    ReadMovedFrame: { $ref: "components/event.yaml#/ReadMovedFrame" }
    AgentWorkingFrame: { $ref: "components/event.yaml#/AgentWorkingFrame" }
    SyncEvent: { $ref: "components/event.yaml#/SyncEvent" }
    SyncAnswer: { $ref: "components/event.yaml#/SyncAnswer" }
    SyncDelta: { $ref: "components/event.yaml#/SyncDelta" }
    SyncReset: { $ref: "components/event.yaml#/SyncReset" }
    SyncSnapshot: { $ref: "components/event.yaml#/SyncSnapshot" }
    SearchPart: { $ref: "components/search.yaml#/SearchPart" }
    SearchResult: { $ref: "components/search.yaml#/SearchResult" }
    SearchConversation: { $ref: "components/search.yaml#/SearchConversation" }
    SearchFilter: { $ref: "components/search.yaml#/SearchFilter" }
    SearchResponse: { $ref: "components/search.yaml#/SearchResponse" }

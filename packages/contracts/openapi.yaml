openapi: 3.1.0
info:
  title: Convoz web API
  version: 0.1.0
  description: |
    Every route of design §13, listed once here; each one's operations live in paths/<module>.yaml and its schemas in
    components/<module>.yaml, so a work package edits only its own module's files. An empty path item is a §13 route not
    specified yet. Event payloads are JSON Schema files, one per type: events/<type>.v1.json. This contract is the source of
    truth for the web client: packages/api-client generates its types from it (`pnpm --filter @convoz/api-client gen`,
    checked in CI by `gen:check`).

    Every request is same-origin JSON with the device cookie. Every write under /api carries `Origin`, `X-Convoz: 1` and
    `Content-Type: application/json`, or the server answers 403 `csrf`. Errors are `{error:{code,message}}`.
    A route marked with the X-Convoz-Step-Up parameter needs the id of a fresh passkey check for that action.

    Every operation declares who may call it in `x-authz`: `auth` is the credential class (pub, human, limited, owner, machine,
    lease), `lease` says whether an agent lease also meets a person's route (accept) or is told 403 (refuse), `scope` is the scope
    a lease needs, `step_up` is the action a passkey check must cover. The security matrix of the e2e suite (security.wp18) holds
    this list against the live route table and against what the server answers to each credential.

    Live updates come from GET /api/stream (server-sent events), listed here for completeness; the client opens it with EventSource.
servers:
  - url: /
security:
  - deviceCookie: []


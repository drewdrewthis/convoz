# Paths of the audit module (design §13). Only the work package that owns audit edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/api/admin/audit:
  get:
    operationId: listAudit
    x-authz: { auth: owner }
    summary: "The audit trail, newest first (the owner)."
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

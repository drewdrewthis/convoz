# Paths of the identity module (design §13). Only the work package that owns identity edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/api/me:
  get:
    operationId: me
    responses:
      "200":
        description: Who the caller is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Me" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identities:
  get:
    operationId: identities
    summary: Everyone the owner can chat with (the Crew list).
    responses:
      "200":
        description: Identities in the order they were made.
        content:
          application/json:
            schema:
              type: object
              required: [identities]
              properties:
                identities: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Identity" } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/profile:
  patch:
    operationId: patchProfile
    summary: An agent changes its own profile, once an hour.
    description: |
      Send the fields to change; the rest stay. The handle is not a field (naming it is 400). A change within an hour of the last
      one is 429 `rate_limited` with Retry-After. A display name that looks like another identity is 409 `name_taken`.
    security: [{ leaseBearer: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ProfileRequest" }
    responses:
      "200":
        description: The profile after the change.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Profile" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identities/{id}/avatar.svg: {}  # not specified yet
/api/crew/agents:
  post:
    operationId: createAgent
    summary: The owner makes an agent identity. Names are unique and never reused (I-3).
    description: |
      Needs a fresh passkey check for `identity.create`. A handle that exists or was used before is 409 `handle_taken`; a handle or display
      name that is not valid is 400 `invalid_request` with the field. The agent has no key: a machine that allows the handle speaks for it.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [handle, display_name]
            properties:
              handle: { type: string }
              display_name: { type: string }
    responses:
      "201":
        description: The new agent.
        content:
          application/json:
            schema:
              type: object
              required: [identity]
              properties:
                identity:
                  type: object
                  required: [id, handle, display_name, kind]
                  properties:
                    id: { type: integer, format: int64 }
                    handle: { type: string }
                    display_name: { type: string }
                    kind: { type: string, enum: [agent] }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identities/{id}/disable:
  post:
    operationId: disableIdentity
    summary: The owner disables an agent. Identities are never deleted (I-2).
    description: |
      Needs a fresh passkey check for `identity.disable`. Every session of the agent ends at once, its open asks close, and its handle
      stays used (I-38). An agent that is not there or already disabled is 404.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

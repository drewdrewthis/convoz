# Paths of the identity module (design §13). Only the work package that owns identity edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/api/me:
  get:
    x-authz: { auth: limited, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: me
    responses:
      "200":
        description: Who the caller is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Me" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identities:
  get:
    x-authz: { auth: limited }
    operationId: identities
    summary: Everyone the owner can chat with (the Crew list).
    responses:
      "200":
        description: Identities in the order they were made.
        content:
          application/json:
            schema:
              type: object
              required: [identities]
              properties:
                identities: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Identity" } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/profile:
  patch:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: patchProfile
    summary: "Change the caller's own profile: an agent its words (once an hour), any caller its avatar."
    description: |
      Send the fields to change; the rest stay. The handle is not a field (naming it is 400). A change within an hour of the last
      one is 429 `rate_limited` with Retry-After. A display name that looks like another identity is 409 `name_taken`.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ProfileRequest" }
    responses:
      "200":
        description: The profile after the change.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Profile" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identities/{id}/avatar.svg:
  get:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: getAvatar
    summary: An identity's SVG avatar, served so it can only draw (I-32).
    description: "`Content-Security-Policy: default-src 'none'; sandbox` and nosniff. Render it only through an img."
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200":
        description: The SVG.
        content:
          image/svg+xml:
            schema: { type: string }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/crew/agents:
  post:
    x-authz: { auth: owner, step_up: identity.create }
    operationId: createAgent
    summary: The owner makes an agent identity. Names are unique and never reused (I-3).
    description: |
      Needs a fresh passkey check for `identity.create`. A handle that exists or was used before is 409 `handle_taken`; a handle or display
      name that is not valid is 400 `invalid_request` with the field. The agent has no key: a machine that allows the handle speaks for it.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [handle, display_name]
            properties:
              handle: { type: string }
              display_name: { type: string }
    responses:
      "201":
        description: The new agent.
        content:
          application/json:
            schema:
              type: object
              required: [identity]
              properties:
                identity:
                  type: object
                  required: [id, handle, display_name, kind]
                  properties:
                    id: { type: integer, format: int64 }
                    handle: { type: string }
                    display_name: { type: string }
                    kind: { type: string, enum: [agent] }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identities/{id}/disable:
  post:
    x-authz: { auth: owner }
    operationId: disableIdentity
    summary: The owner revokes an agent's key ("Revoke key" in Crew). Identities are never deleted (I-2).
    description: |
      Confirmed inline in the app; no passkey check (owner said: "Removal is just revoking their key"). Every session of the agent
      ends at once, no new session can start as it, its open asks close, and its handle stays used (I-38). An agent that is not there or
      already disabled is 404.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/agents/{id}/read-all:
  put:
    x-authz: { auth: owner, step_up: identity.read_all }
    operationId: setAgentReadAll
    summary: The owner lets an agent read every conversation and thread, or takes the right back ("Can read all conversations" in Crew).
    description: |
      Owner said (msg 784): "give an agent privileges to be able to monitor and review all conversations and threads without being added.
      Not the inbox". Needs a fresh passkey check for `identity.read_all` on this agent. With the right the agent reads any conversation
      that is not in the trash (conversations, messages, threads, edits, plans, asks, files, search) and posts a message or reply in it as
      itself. It cannot add or remove anyone, rename, upload, write a plan, mark read, or answer, dismiss or snooze an ask, and it gets no
      inbox item, mention or "Seen by" for a conversation it is not in. Off takes effect on the agent's next request. Nothing is posted in
      any chat. An agent that is not there or is disabled is 404.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [on]
            properties:
              on: { type: boolean }
    responses:
      "200":
        description: The right after the change.
        content:
          application/json:
            schema:
              type: object
              required: [read_all]
              properties:
                read_all: { type: boolean }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/waiting:
  get:
    x-authz: { auth: lease }
    security: [{ leaseBearer: [] }]
    operationId: getWaiting
    summary: What waits on the owner in every conversation (`convoz waiting`). Only an agent with the read-all right; any other caller is 403.
    responses:
      "200":
        description: Open asks, owner messages unanswered for 10 minutes, waiting plan items and the owner's unread counts.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/WaitingResponse" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/handle:
  post:
    x-authz: { auth: lease }
    security: [{ leaseBearer: [] }]
    operationId: changeOwnHandle
    summary: An agent changes its own handle. It applies at once, with no approval.
    description: |
      Owner said: "Handles I think can also change, that seems fine because there's an id, right?" and "the handle is never reused";
      asked whether the agent's own change needs approval: "Change at once, no approval".
      The new handle passes every rule of a new one (valid, not reserved, not taken, never used before, no UTS-39 look-alike of any
      handle or display name; the agent's own display name excepted), and a handle changes at most 3 times a day (429 `rate_limited`
      with Retry-After). A handle that would bring the agent under the glob of a machine that may not act as it now is 400. One
      transaction, as the owner's change: the old handle stays an alias until `previous_until` (30 days), and every conversation the
      agent is in gets the line "@old is now @new". It sends no push.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/HandleChangeBody" }
    responses:
      "200":
        description: The handle changed.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/HandleChanged" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identities/{id}/handle:
  post:
    x-authz: { auth: owner }
    operationId: changeHandle
    summary: The owner changes an agent's handle in Crew → the agent profile. No passkey check.
    description: |
      The same rules and the same path as an agent's own change (I-51). One transaction: the old handle is retired at once and never
      used again, and every conversation the agent is in gets the line "@old is now @new". A human's handle never changes here (400).
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [handle]
            additionalProperties: false
            properties:
              handle: { type: string }
    responses:
      "200":
        description: The handle changed.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/HandleChanged" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

# Paths of page sharing (page-share.feature): the owner's Chrome extension shares one tab with one conversation, and the agents of
# that conversation read it or take a screenshot of it. Every path answers 404 unless the server names the extension
# (--extension-origin). The extension's calls must carry exactly that Origin (403 otherwise). The root openapi.yaml lists each path once.
/api/page/shares:
  post:
    x-authz: { auth: human }
    operationId: startPageShare
    summary: The extension shares a tab with a conversation the owner sees.
    description: |
      tab_origin is the tab's http or https origin (no path; 400 otherwise). A conversation the owner cannot see is 404. A conversation
      has one live share: a new one ends the old. The share lives in memory: a restart ends it, and so do 45 s without a poll.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/PageShareRequest" }
    responses:
      "201":
        description: The share.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PageShareResponse" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  get:
    x-authz: { auth: lease }
    security: [{ leaseBearer: [] }]
    operationId: listPageShares
    summary: The live shares of the conversations the agent is in.
    responses:
      "200":
        description: The shares; an empty list when none.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PageSharesResponse" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/page/shares/{id}:
  parameters:
    - { name: id, in: path, required: true, schema: { type: string }, description: The id of the share. }
  delete:
    x-authz: { auth: human }
    operationId: stopPageShare
    summary: The share ends (Stop, the panel closing, the tab leaving its site).
    responses:
      "204": { description: Ended. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/page/shares/{id}/next:
  parameters:
    - { name: id, in: path, required: true, schema: { type: string }, description: The id of the share. }
  get:
    x-authz: { auth: human }
    operationId: nextPageRequest
    summary: The extension's long poll for the next request of an agent.
    description: Each poll keeps the share live. 404 once the share ended.
    parameters:
      - { name: wait, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 25 }, description: Seconds to wait for a request; more is 25. }
    responses:
      "200":
        description: The request to answer.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PageNextResponse" }
      "204": { description: No request came within the wait. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/page/requests:
  post:
    x-authz: { auth: lease, scope: page }
    security: [{ leaseBearer: [] }]
    operationId: askPage
    summary: An agent of the conversation reads the shared tab or takes a screenshot of it.
    description: |
      Waits up to 25 s for the extension. 409 `no_shared_tab` when no tab is shared, or the tab is gone, not in front or on another
      site; 403 for an agent outside the conversation; 400 for an op that is not read or shot; 429 while another request of the share
      runs, or for a second screenshot within 2 s; 504 when the extension does not answer in time. Each read and shot writes a system
      line (page.read, page.shot); a shot also puts the image in the conversation. The page's words never become a message.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/PageAsk" }
    responses:
      "200":
        description: The read or the screenshot.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PageAnswer" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/page/requests/{id}/result:
  parameters:
    - { name: id, in: path, required: true, schema: { type: string }, description: The id the poll handed over. }
  post:
    x-authz: { auth: human }
    operationId: answerPageRequest
    summary: The extension's answer to a request.
    description: A read over 256 KB or a PNG over 5 MB is 413, and the agent is told so. An unknown request is 404.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/PageResult" }
    responses:
      "204": { description: Handed to the agent. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

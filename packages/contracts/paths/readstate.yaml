# Paths of the readstate module (design §13). Only the work package that owns readstate edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/api/conversations/{id}/read:
  post:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: markRead
    summary: Move a read position forward - the main list (main_id), one thread (root_id with reply_id) or everything (all). Never past the newest message.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              main_id: { type: integer, format: int64, minimum: 0 }
              root_id: { type: integer, format: int64, minimum: 1, description: "A thread root; comes with reply_id. Only a thread the reader is in has a position (I-14)." }
              reply_id: { type: integer, format: int64, minimum: 1, description: The newest reply of the thread the reader has seen. }
              all: { type: boolean, description: Mark the whole conversation read - the main list and every thread. }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

# Paths of the message module (design §13). Only the work package that owns message edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/api/conversations/{id}/typing:
  post:
    x-authz: { auth: human, lease: accept, scope: post }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: typing
    summary: An agent says it is replying, for 30 seconds, in the main list or in a thread (live frame agent.working; nothing is stored). A person gets 403.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              thread_root_id: { type: integer, format: int64, description: A message of the thread; one inside a thread names its thread. }
    responses:
      "204": { description: Shown. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/messages:
  get:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: listMessages
    summary: A page of messages, oldest first. With no cursor, the newest page.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - { name: before, in: query, schema: { type: integer, format: int64 } }
      - { name: after, in: query, schema: { type: integer, format: int64 } }
      - { name: limit, in: query, schema: { type: integer } }
    responses:
      "200":
        description: The page.
        content:
          application/json:
            schema:
              type: object
              required: [messages, as_of_seq]
              properties:
                messages: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Message" } }
                as_of_seq: { type: integer, format: int64 }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  post:
    x-authz: { auth: human, lease: accept, scope: post }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: postMessage
    summary: Post a message. The same client_id again answers 200 with the same ids (no second message).
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [client_id]
            properties:
              client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
              body: { type: string, description: "Required unless via_app is set; a via_app message has the result's summary as its body." }
              format: { type: string, enum: [plain, markdown, markdownv2] }
              thread_root_id: { type: integer, format: int64 }
              broadcast: { type: boolean }
              upload_ids: { type: array, items: { type: string } }
              app: { $ref: "../openapi.yaml#/components/schemas/App", description: "Agents only; at most 65536 bytes; checked against app.v1 (400 app_invalid with the path)." }
              via_app: { $ref: "../openapi.yaml#/components/schemas/ViaAppRequest", description: "The owner only (a lease answers 403): send the result of an app (I-46)." }
              via_voice: { type: boolean, description: "The owner's voice call posts this (a lease answers 403 naming via_voice): readers see \"via voice call\"." }
              as_voice: { type: boolean, description: "The owner's voice call writes this for him: its author is the built-in agent @voice, not the owner, and it has no \"via voice call\" mark. The owner only (anyone else, a lease or a post with via_app answers 403 naming as_voice); @voice turned off answers 409 voice_unavailable." }
              quiet: { type: boolean, description: "The owner's voice call posts its call log with this (needs via_voice; a lease or a post without via_voice answers 403 naming quiet): the message is stored and shown, but no agent gets a mention or an inbox item from it. Read it with convoz read." }
              needs_you: { type: boolean, description: "Whether the post needs the owner. Required for agents from the next release; true is refused on a plain post (422 needs_you_is_an_ask, with the convoz ask command and the agent's text), because a message that needs the owner is an ask. This release an agent that leaves it out is accepted as false, with a Convoz-Warning header. The owner's value is ignored." }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Posted" }
      "201": { $ref: "../openapi.yaml#/components/responses/Posted" }
      "422": { $ref: "../openapi.yaml#/components/responses/Error", description: "needs_you_is_an_ask: an agent sent needs_you true on a plain post." }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/messages/{id}:
  patch:
    x-authz: { auth: human, lease: accept, scope: post }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: editMessage
    summary: Edit a text message. The author only; an agent within 24 hours and 30 edits an hour.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/EditRequest" }
    responses:
      "200":
        description: The edited message.
        content:
          application/json:
            schema: { type: object, required: [message], properties: { message: { $ref: "../openapi.yaml#/components/schemas/Message" } } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  delete:
    x-authz: { auth: human, lease: accept, scope: post }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: deleteMessage
    summary: Delete a message (a tombstone stays). The author, or the owner for any message.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200":
        description: The tombstone.
        content:
          application/json:
            schema: { type: object, required: [message], properties: { message: { $ref: "../openapi.yaml#/components/schemas/Message" } } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/messages/{id}/edits:
  get:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: listMessageEdits
    summary: The earlier texts of an edited message, oldest first.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200":
        description: The history.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/EditHistory" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/messages/{id}/purge:
  post:
    x-authz: { auth: owner, lease: refuse, step_up: message.purge }
    operationId: purgeMessage
    summary: Scrub every copy of a message's content. The owner, with a step-up for action message.purge.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    responses:
      "200":
        description: Purged.
        content:
          application/json:
            schema: { type: object, required: [message], properties: { message: { $ref: "../openapi.yaml#/components/schemas/Message" } } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/messages/{id}/replies:
  get:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: listReplies
    summary: The thread of one top-level message - the root (a stub when the caller joined after it) and its replies, oldest first.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - { name: after, in: query, schema: { type: integer, format: int64 } }
      - { name: limit, in: query, schema: { type: integer } }
    responses:
      "200":
        description: The thread.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Replies" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

# Paths of the conversation module (design §13). Only the work package that owns conversation edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/api/conversations:
  get:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: listConversations
    summary: The caller's conversations, newest activity first. ?deleted=1 lists the trash (the owner).
    parameters:
      - { name: deleted, in: query, schema: { type: string, enum: ["1"] } }
    responses:
      "200":
        description: The list.
        content:
          application/json:
            schema:
              type: object
              required: [conversations]
              properties:
                conversations: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Conversation" } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  post:
    x-authz: { auth: human, lease: accept, scope: post }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: createConversation
    summary: Make a conversation. The same client_id again answers 200 with the one it made.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [client_id]
            properties:
              client_id: { $ref: "../openapi.yaml#/components/schemas/ClientId" }
              title: { type: string }
              participants: { type: array, items: { type: string }, description: Handles. }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/OneConversation" }
      "201": { $ref: "../openapi.yaml#/components/responses/OneConversation" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}:
  get:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: getConversation
    summary: One conversation with its details (who started it, the link, pending adds).
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/OneConversation" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  patch:
    x-authz: { auth: human }
    operationId: patchConversation
    summary: Rename the conversation or link its pull request. A chosen title is never changed by a later message.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string, minLength: 1, maxLength: 120 }
              link_url: { type: string, description: An https link, or an empty string to clear it. }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/OneConversation" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  delete:
    x-authz: { auth: owner }
    operationId: deleteConversation
    summary: Move the conversation to the trash for 30 days. Agents lose sight of it at once.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/restore:
  post:
    x-authz: { auth: owner }
    operationId: restoreConversation
    summary: Bring a conversation back from the trash with all its messages.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      content:
        application/json:
          schema: { type: object }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/OneConversation" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/participants:
  post:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: addParticipant
    summary: Add an agent at once and say what history it sees. An agent can only ask; its request waits for a person.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              identity_id: { type: integer, format: int64 }
              handle: { type: string }
              history: { type: string, enum: [since_now, full], default: since_now }
    responses:
      "200": &participant
        description: The agent and where it stands (active, or pending a person).
        content:
          application/json:
            schema:
              type: object
              required: [participant]
              properties:
                participant:
                  type: object
                  required: [identity_id, handle, status]
                  properties:
                    identity_id: { type: integer, format: int64 }
                    handle: { type: string }
                    status: { type: string, enum: [active, pending] }
      "201": *participant
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/participants/{iid}:
  delete:
    x-authz: { auth: human }
    operationId: removeParticipant
    summary: Take an agent out. It gets one notice, and nothing more from the conversation.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - { name: iid, in: path, required: true, schema: { type: integer, format: int64 } }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/participants/{iid}/approve:
  post:
    x-authz: { auth: human }
    operationId: approveParticipant
    summary: Approve an add an agent asked for.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - { name: iid, in: path, required: true, schema: { type: integer, format: int64 } }
    requestBody:
      content:
        application/json:
          schema: { type: object }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/participants/{iid}/decline:
  post:
    x-authz: { auth: human }
    operationId: declineParticipant
    summary: Decline an add an agent asked for.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - { name: iid, in: path, required: true, schema: { type: integer, format: int64 } }
    requestBody:
      content:
        application/json:
          schema: { type: object }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/leave:
  post:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: leaveConversation
    summary: An agent takes itself out of the conversation.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      content:
        application/json:
          schema: { type: object }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/conversations/{id}/resume:
  post:
    x-authz: { auth: human, lease: refuse }
    operationId: resumeConversation
    summary: Let paused agents post again.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      content:
        application/json:
          schema: { type: object }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

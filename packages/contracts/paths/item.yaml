# Paths of the item module (specs/contracts/feed-items.feature). Only the work package that owns items edits this file.
/api/conversations/{id}/items/{key}/{event}:
  post:
    x-authz: { auth: lease, scope: status }
    security: [{ leaseBearer: [] }]
    operationId: postItem
    summary: An agent moves one of its own steps; one call per transition.
    description: |
      The agent comes from the lease, never the body, so it reaches only its own items. `event` is start, block, done, fyi, drop, say or answer. answer replies in the thread of the item's message, quoting the item's title, and marks it done, in one transaction; `outcome` is the text (1 to 4000 characters); only a started item with a message can be answered (409 otherwise).
      The first step of an agent in a conversation is now; later ones are pending, and when the now step leaves (done, fyi, drop) the next one
      is promoted in the same transaction. Saying start or block again for a key edits the step; block always raises the version. A move the
      state does not allow is 409 and changes nothing. Title, context and recommendation are plain text (no markdown, no links): title 1 to 200
      characters, context 2000, recommendation 500, key 1 to 64; anything else is 400. There is no cap on open items.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - { name: key, in: path, required: true, schema: { type: string } }
      - { name: event, in: path, required: true, schema: { type: string, enum: [start, block, done, fyi, drop, say, answer] } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ItemRequest" }
    responses:
      "200":
        description: The item as it now is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedItem" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/messages/{id}/take:
  post:
    x-authz: { auth: lease, scope: status }
    security: [{ leaseBearer: [] }]
    operationId: takeMessage
    summary: An agent takes a question of the owner as an item on his message.
    description: |
      Only a person's message in the main chat can be taken (400 for an agent's message or a reply in a thread). The first item is the
      question, started (pending when the plan already has a now), the steps follow as pending items; all are rooted at the message and
      nothing is posted. Without `question` the title is the message text and a message that already has an item is 409. Context is required.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/TakeRequest" }
    responses:
      "200":
        description: The items made, the question first.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/TakeResponse" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/feed:
  get:
    x-authz: { auth: owner, lease: refuse }
    operationId: getFeed
    summary: The owner's feed items.
    description: Owner only. Open items in plan order, then the last 20 finished ones.
    responses:
      "200":
        description: The feed.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedResponse" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/feed/{id}/accept:
  post:
    x-authz: { auth: owner, lease: refuse }
    operationId: feedAccept
    summary: Accept what the item recommends; it is done at once.
    description: Owner only; an agent lease is refused. 404 for an unknown item, 409 for a state or version that does not allow it.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/FeedAcceptRequest" }
    responses:
      "200":
        description: The item as it now is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedItem" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/feed/{id}/answer:
  post:
    x-authz: { auth: owner, lease: refuse }
    operationId: feedAnswer
    summary: Add info to a blocking item; with resolves it is done.
    description: Owner only; an agent lease is refused. 404 for an unknown item, 409 for a state or version that does not allow it.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/FeedAnswerRequest" }
    responses:
      "200":
        description: The item as it now is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedItem" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/feed/{id}/reply:
  post:
    x-authz: { auth: owner, lease: refuse }
    operationId: feedReply
    summary: Write in the item's thread. The first write starts it.
    description: >
      Owner only; an agent lease is refused. With no thread yet the text becomes a new message with the item title quoted above it, and its id
      is kept as thread_root_id; otherwise it is a reply in that thread. 404 for an unknown item, 409 if another writer started the thread at the same moment (send again).
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/FeedReplyRequest" }
    responses:
      "200":
        description: The item as it now is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedItem" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/feed/{id}/ack:
  post:
    x-authz: { auth: owner, lease: refuse }
    operationId: feedAck
    summary: "Okay: acknowledge a pending, started, blocking or fyi item. The state stays; the feed hides it until the agent moves the item again."
    description: Owner only; an agent lease is refused. 404 for an unknown item, 409 for a state or version that does not allow it.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200":
        description: The item as it now is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedItem" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/feed/{id}/snooze:
  put:
    x-authz: { auth: owner, lease: refuse }
    operationId: feedSnooze
    summary: Hide an item until a time ahead.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/FeedSnoozeRequest" }
    responses:
      "200":
        description: The item as it now is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedItem" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  delete:
    x-authz: { auth: owner, lease: refuse }
    operationId: feedUnsnooze
    summary: Bring a snoozed item back.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200":
        description: The item as it now is.
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/FeedItem" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

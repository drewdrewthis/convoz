# Paths of the auth module (design §13). Only the work package that owns auth edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/api/auth/bootstrap/check:
  post:
    x-authz: { auth: pub }
    security: []
    operationId: bootstrapCheck
    summary: What the setup link in the page is worth. Changes nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
    responses:
      "200":
        description: The link state.
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [ok, invalid, used, expired] }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/bootstrap/options:
  post:
    x-authz: { auth: pub }
    security: []
    operationId: bootstrapOptions
    summary: Start the first passkey registration of a setup link.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string }
              handle: { type: string }
              display_name: { type: string }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Ceremony" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/bootstrap/verify:
  post:
    x-authz: { auth: pub }
    security: []
    operationId: bootstrapVerify
    summary: Finish the registration; sets the device cookie. The recovery codes come only when the owner was made now.
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/CeremonyFinish" }
    responses:
      "200":
        description: The owner, and the recovery codes once.
        content:
          application/json:
            schema:
              type: object
              required: [owner]
              properties:
                owner: { $ref: "../openapi.yaml#/components/schemas/Owner" }
                recovery_codes: { type: array, items: { type: string } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/passkey/login/options:
  post:
    x-authz: { auth: pub }
    security: []
    operationId: loginOptions
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Ceremony" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/passkey/login/verify:
  post:
    x-authz: { auth: pub }
    security: []
    operationId: loginVerify
    summary: Sign in; sets the device cookie.
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/CeremonyFinish" }
    responses:
      "200":
        description: Signed in.
        content:
          application/json:
            schema:
              type: object
              required: [owner]
              properties:
                owner: { $ref: "../openapi.yaml#/components/schemas/Owner" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/recovery:
  post:
    x-authz: { auth: pub }
    security: []
    operationId: useRecoveryCode
    summary: Use one recovery code; the device gets a limited session that may only add a passkey.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string }
    responses:
      "200":
        description: A limited device session.
        content:
          application/json:
            schema:
              type: object
              required: [limited]
              properties:
                limited: { type: boolean }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/passkey/register/options:
  post:
    x-authz: { auth: limited }
    operationId: registerOptions
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Ceremony" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/passkey/register/verify:
  post:
    x-authz: { auth: limited, step_up: passkey.add }
    operationId: registerVerify
    summary: Add a passkey. A full device needs a step-up (passkey.add); a recovery device does not and gets a full session.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/StepUpOptional"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/CeremonyFinish" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Ok" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/step-up/options:
  post:
    x-authz: { auth: human, lease: refuse }
    operationId: stepUpOptions
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [action]
            properties:
              action: { $ref: "../openapi.yaml#/components/schemas/StepUpAction" }
              target_id: { type: integer, format: int64 }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Ceremony" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/step-up/verify:
  post:
    x-authz: { auth: human }
    operationId: stepUpVerify
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/CeremonyFinish" }
    responses:
      "200":
        description: The single-use step-up, for X-Convoz-Step-Up.
        content:
          application/json:
            schema:
              type: object
              required: [step_up_id]
              properties:
                step_up_id: { type: integer, format: int64 }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/logout:
  post:
    x-authz: { auth: limited }
    operationId: logout
    summary: Revoke this device; answers Clear-Site-Data.
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "204": { description: Signed out. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/auth/signout-all:
  post:
    x-authz: { auth: human, step_up: signout.all }
    operationId: signOutAll
    summary: End every other device session of the owner. Needs a step-up (signout.all).
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200":
        description: The other devices are signed out.
        content:
          application/json:
            schema:
              type: object
              required: [signed_out]
              properties:
                signed_out: { type: integer, description: How many devices ended. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/passkeys:
  get:
    x-authz: { auth: human }
    operationId: passkeys
    responses:
      "200":
        description: The owner's active passkeys.
        content:
          application/json:
            schema:
              type: object
              required: [passkeys]
              properties:
                passkeys: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Passkey" } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/passkeys/{id}:
  delete:
    x-authz: { auth: human, step_up: passkey.remove }
    operationId: removePasskey
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    responses:
      "204": { description: Removed. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/recovery-codes:
  get:
    x-authz: { auth: human }
    operationId: recoveryCodesLeft
    responses:
      "200":
        description: How many codes can still be used.
        content:
          application/json:
            schema:
              type: object
              required: [remaining]
              properties:
                remaining: { type: integer }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  post:
    x-authz: { auth: human, step_up: recovery.regenerate }
    operationId: regenerateRecoveryCodes
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200":
        description: Ten new codes, shown once; the old ones stop working.
        content:
          application/json:
            schema:
              type: object
              required: [recovery_codes]
              properties:
                recovery_codes: { type: array, items: { type: string } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/requests/deny-all:
  post:
    x-authz: { auth: owner }
    operationId: denyAllRequests
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200":
        description: How many were denied.
        content:
          application/json:
            schema:
              type: object
              required: [denied]
              properties:
                denied: { type: integer }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/requests/{id}/approve:
  post:
    x-authz: { auth: owner }
    operationId: approveRequest
    summary: One tap on the card in Now. The owner's signed-in session is the authority; there is no passkey check and no typed code.
    description: |
      A request that carries an identity (convoz login --as) also makes that agent and lets the new machine act as it; an empty
      allow-list is then enough. A handle that was taken or became a look-alike since the request is 409 handle_taken or 400.
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string }
              allow: { $ref: "../openapi.yaml#/components/schemas/Allow" }
              scopes: { type: array, items: { type: string } }
              code_tail: { type: string, description: "The last 4 characters of the request's code. Required for an internet request when the server runs with --agent-approve-code; 403 code_mismatch otherwise." }
    responses:
      "201":
        description: The machine is connected.
        content:
          application/json:
            schema:
              type: object
              required: [machine]
              properties:
                machine: { $ref: "../openapi.yaml#/components/schemas/Machine" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identity-requests/{ref}/approve:
  post:
    x-authz: { auth: owner }
    operationId: approveIdentityRequest
    summary: One tap on the card of an agent that a logged-in machine asked for. No passkey check.
    description: |
      Makes the identity (created by the machine), lets the machine act as it, applies the description and avatar the agent sent, and
      seats it in the conversation it named (history since the add, the I-17 participants path). The rules for the handle are checked
      again here: taken is 409 handle_taken, a look-alike is 400. A request that was decided or expired is 404.
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "201":
        description: The agent exists and the machine may act as it.
        content:
          application/json:
            schema:
              type: object
              required: [identity, machine]
              properties:
                identity:
                  type: object
                  required: [id, handle, display_name, kind]
                  properties:
                    id: { type: integer, format: int64 }
                    handle: { type: string }
                    display_name: { type: string }
                    kind: { type: string, enum: [agent] }
                machine:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identity-requests/{ref}/deny:
  post:
    x-authz: { auth: owner }
    operationId: denyIdentityRequest
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/identity-requests/{ref}/avatar.svg:
  get:
    x-authz: { auth: owner }
    operationId: identityRequestAvatar
    summary: The cleaned SVG a waiting request carries. Show it only in an img (I-32).
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    responses:
      "200": { description: The SVG., content: { image/svg+xml: { schema: { type: string } } } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/requests/{id}/deny:
  post:
    x-authz: { auth: owner }
    operationId: denyRequest
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/Empty" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines:
  get:
    x-authz: { auth: owner }
    operationId: machines
    responses:
      "200":
        description: Every active machine.
        content:
          application/json:
            schema:
              type: object
              required: [machines]
              properties:
                machines: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Machine" } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/{id}:
  patch:
    x-authz: { auth: owner, step_up: machine.allow }
    operationId: patchMachine
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [allow]
            properties:
              allow: { $ref: "../openapi.yaml#/components/schemas/Allow" }
    responses:
      "200":
        description: The machine with its new allow-list.
        content:
          application/json:
            schema:
              type: object
              required: [machine]
              properties:
                machine: { $ref: "../openapi.yaml#/components/schemas/Machine" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/{id}/reveal:
  post:
    x-authz: { auth: owner, step_up: machine.reveal }
    operationId: revealMachineKey
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/MachineKey" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/{id}/regenerate:
  post:
    x-authz: { auth: owner, step_up: machine.regenerate }
    operationId: regenerateMachineKey
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/MachineKey" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/{id}/revoke:
  post:
    x-authz: { auth: owner, step_up: machine.revoke }
    operationId: revokeMachine
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
      - $ref: "../openapi.yaml#/components/parameters/StepUp"
    requestBody: { $ref: "../openapi.yaml#/components/requestBodies/Empty" }
    responses:
      "200": { $ref: "../openapi.yaml#/components/responses/MachineKey" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/devices:
  get:
    operationId: listDevices
    x-authz: { auth: human }
    summary: "The signed-in devices of the caller."
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/me/devices/{id}:
  delete:
    operationId: revokeDevice
    x-authz: { auth: human }
    summary: "Sign one device out."
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/Id"
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/device/code:
  post:
    operationId: requestDeviceCode
    x-authz: { auth: pub }
    security: []
    summary: "A machine asks to be logged in (device flow, design 7). No cookie, no key; limited per source."
    description: |
      The body may carry `identity` {handle, display_name?, description?, avatar_svg?, conversation_id?}: the agent's own identity package.
      A handle that exists or was used is 409 handle_taken; a reserved, invalid or look-alike one, a bad description (one plain line,
      at most 80 characters), a bad avatar or a conversation the owner is not in is 400. A request reserves no handle.
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/device/token:
  post:
    operationId: pollDeviceToken
    x-authz: { auth: pub }
    security: []
    summary: "The machine polls for its key until the owner decides. No cookie, no key."
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/machines/requests:
  get:
    operationId: listMachineRequests
    x-authz: { auth: owner }
    summary: "The pending machine login requests (the owner)."
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/sessions:
  post:
    operationId: mintSession
    x-authz: { auth: machine }
    security: [{ machineKey: [] }]
    summary: A machine key mints the lease of an agent session (design 7).
    description: |
      With `create` {display_name?, description?, avatar_svg?, conversation_id?}: an existing agent the machine may act as just gets
      its lease; one it may not act as is 409 handle_taken. A missing one is made at once when the machine has the create_identity
      scope and allows the handle; otherwise the answer is 202 with `request.ref`, and the machine asks again with
      `create.request` = that ref until the owner decides (201 with the lease; 403 request_denied; 410 request_expired).
      A machine files at most 5 requests in 24 hours; a request lives 24 hours. Only the machine that filed a request can ask about it.
      `as` may name a handle the agent had before (I-51): for 30 days after the change the lease is minted for that agent and the answer
      carries `renamed` {from, to, until}; after that it is 403 `handle_renamed`, whose message names the new handle.
    responses:
      "201": { description: "The lease and its session; `renamed` when `as` named a handle the agent had before." }
      "202": { description: The owner has not decided; ask again with the ref. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  get:
    x-authz: { auth: owner }
    operationId: listSessions
    summary: The sessions of every machine and agent, newest first (the owner), live ones and recently ended ones.
    responses:
      "200":
        description: The sessions.
        content:
          application/json:
            schema:
              type: object
              required: [sessions]
              properties:
                sessions: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Session" } }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/sessions/renew:
  post:
    operationId: renewSession
    x-authz: { auth: lease }
    security: [{ leaseBearer: [] }]
    summary: "The agent renews its own lease."
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/sessions/me:
  delete:
    operationId: endSession
    x-authz: { auth: lease }
    security: [{ leaseBearer: [] }]
    summary: "The agent ends its own session."
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

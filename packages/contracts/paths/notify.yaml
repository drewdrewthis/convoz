# Paths of the notify module (design §13). Only the work package that owns notify edits this file; the root
# openapi.yaml lists each path once.
/api/push/vapid-key:
  get:
    operationId: pushVapidKey
    summary: "The VAPID public key the browser subscribes with."
    responses:
      "200":
        description: The key.
        content:
          application/json:
            schema: { $ref: "../components/notify.yaml#/VapidKey" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/push/subscriptions:
  get:
    operationId: pushSubscriptions
    summary: "The owner's push subscriptions, one per device, with the state of each (a gone one is listed as disabled)."
    responses:
      "200":
        description: The subscriptions, newest first.
        content:
          application/json:
            schema: { $ref: "../components/notify.yaml#/PushSubscriptionList" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  post:
    operationId: pushSubscribe
    summary: "Store this device's subscription. A device has one live subscription: a new endpoint replaces the old one. An endpoint off the push-service allow-list, or with bad keys, is a 400 (I-28)."
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/notify.yaml#/PushSubscriptionRequest" }
    responses:
      "201":
        description: The subscription is stored and live.
        content:
          application/json:
            schema: { $ref: "../components/notify.yaml#/PushSubscribed" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
  delete:
    operationId: pushUnsubscribe
    summary: "Turn push off for this device."
    responses:
      "204": { description: Push is off for this device. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/push/test:
  post:
    operationId: pushTest
    summary: "Send a test push to this device now. 409 when the device has no live subscription."
    responses:
      "200":
        description: The result.
        content:
          application/json:
            schema: { $ref: "../components/notify.yaml#/PushTestResult" }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/push/focus:
  put:
    operationId: pushFocus
    summary: "Tell the server which conversation this device has open and focused, so a push for it is held back (active_here). The client repeats it every 30 s; the server forgets it after 90 s."
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/notify.yaml#/PushFocus" }
    responses:
      "204": { description: Noted. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

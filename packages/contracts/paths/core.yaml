# Paths of the core module (design §13). Only the work package that owns core edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/healthz:
  get:
    operationId: health
    x-authz: { auth: pub }
    security: []
    summary: "Liveness: answers ok, with no credential."
    responses:
      "200": { description: The answer. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/ping:
  get:
    x-authz: { auth: human, lease: accept }
    security: [{ deviceCookie: [] }, { leaseBearer: [] }]
    operationId: ping
    summary: The smallest answer there is, for a client to time the link (median RTT of the last heartbeats, design §12.3).
    responses:
      "200":
        description: The server time.
        content:
          application/json:
            schema:
              type: object
              required: [t]
              properties:
                t: { type: integer, format: int64, description: Server unix time in milliseconds. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/version:
  get:
    operationId: getVersion
    x-authz: { auth: pub }
    security: []
    summary: "The build id of the server, with no credential."
    responses:
      "200": { description: "The answer: {version}, and {agent_url} when the server has an agents-only listener (the address an agent outside the tailnet connects to)." }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/install:
  get:
    operationId: getInstallScript
    x-authz: { auth: pub }
    security: []
    summary: "A POSIX sh script that installs this server's CLI (no sudo; ~/.local/bin or $CONVOZ_INSTALL_DIR), with no credential."
    responses:
      "200":
        description: The script.
        content:
          text/x-shellscript:
            schema: { type: string }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/cli/{file}:
  get:
    operationId: getCliFile
    x-authz: { auth: pub }
    security: []
    summary: "A CLI binary of this server (convoz-<os>-<arch>, linux or darwin, amd64 or arm64) or SHA256SUMS, with no credential. With ?v=<server version> the answer is immutable."
    parameters:
      - { name: file, in: path, required: true, schema: { type: string } }
      - { name: v, in: query, required: false, schema: { type: string }, description: The server version; when it matches, the answer is cached for good. }
    responses:
      "200":
        description: The file.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }

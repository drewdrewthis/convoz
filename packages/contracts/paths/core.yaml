# Paths of the core module (design §13). Only the work package that owns core edits this file; the root
# openapi.yaml lists each path once. An empty path item ({}) is a §13 route not specified yet.
/healthz: {}  # not specified yet
/api/ping:
  get:
    operationId: ping
    summary: The smallest answer there is, for a client to time the link (median RTT of the last heartbeats, design §12.3).
    responses:
      "200":
        description: The server time.
        content:
          application/json:
            schema:
              type: object
              required: [t]
              properties:
                t: { type: integer, format: int64, description: Server unix time in milliseconds. }
      default: { $ref: "../openapi.yaml#/components/responses/Error" }
/api/version: {}  # not specified yet

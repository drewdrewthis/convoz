packages:
  - apps/web
  - apps/extension
  - e2e
  - packages/*

# Supply chain: a package version must be at least a day old before it installs.
minimumReleaseAge: 1440
# No dependency runs an install script unless it is listed here.
onlyBuiltDependencies: []
# Ladle's tools: their install scripts only fetch or check a binary the platform package already ships, so they stay off.
allowBuilds:
  "@swc/core": false
  esbuild: false
  msw: false
  # The call's Gemini SDK (apps/web/src/features/call): its install scripts are not needed in a browser bundle.
  "@google/genai": false
  protobufjs: false

apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  name: convoz-failed-sends
  annotations:
    grafana.app/folder: convoz
  labels:
    grafana.com/group: convoz
spec:
  title: "Convoz failed sends"
  trigger:
    interval: 1m
  for: 0s
  noDataState: Ok
  execErrState: Error
  labels:
    team: convoz
  notificationSettings:
    type: SimplifiedRouting
    receiver: cloud-tech
  expressions:
    A:
      queryType: ""
      relativeTimeRange: {from: 10m, to: 0s}
      datasourceUID: "${PROM_DS_UID}"
      model:
        refId: A
        expr: 'sum(increase(convoz_web_send_failures_total{job="convoz"}[5m]))'
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    B:
      datasourceUID: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings: {mode: dropNN}
    C:
      datasourceUID: __expr__
      source: true
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
          - evaluator: {type: gt, params: [0]}
